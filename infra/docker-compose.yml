volumes:
  pg_data:
  static_value:
  media_value:
  frontend_static:                         # <- ДОБАВЛЯЕМ НОВЫЙ ИЗОЛИРОВАННЫЙ VOLUME

services:
  db:
    image: postgres:15-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always

  backend:
    build: ../backend/
    env_file:
      - .env
    environment:                                    # <- ДОБАВЬ ЭТОТ БЛОК
      - PYTHONIOENCODING=utf-8:surrogateescape
    volumes:
      - ../backend/:/app/
      - ../data/:/app/data/
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - db
    restart: always

  frontend:
    build: ../frontend/
    volumes:
      - frontend_static:/app/build/        # <- МОНТИРУЕМ СЮДА РЕЗУЛЬТАТ СБОРКИ ФРОНТЕНДА
    restart: always

  nginx:
    image: nginx:1.22.1-alpine
    user: "root"
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_value:/var/html/static/
      - media_value:/var/html/media/
      - frontend_static:/usr/share/nginx/html/  # <- NGINX БУДЕТ БРАТЬ ФАЙЛЫ ИЗ ЧИСТОГО VOLUME
    depends_on:
      - backend
      - frontend
    restart: always
